<form [formGroup]="footballForm" (ngSubmit)= "onSubmit()">

    <div class="form-group">
      <label for="id">ID</label>
      <input type="number" id="id" formControlName="id" [appHighlightOnFocus]="'pink'"/>
    </div>

    <div class="form-group">
      <label for="playerName">playerName</label>
      <input type="text" id="playerName" formControlName="playerName" [appHighlightOnFocus]="'pink'"/>
    </div>

    <div class="form-group">
      <label for="playerPosition">playerPosition</label>
      <input type="text" id="playerPosition" formControlName="playerPosition" [appHighlightOnFocus]="'pink'"/>
    </div>

    <div class="form-group">
      <label for="playerJerseyNumber">playerJerseyNumber</label>
      <input type="number" id="playerJerseyNumber" formControlName="playerJerseyNumber" [appHighlightOnFocus]="'pink'"/>
    </div>

    <div class="form-group">
      <label for="playerAge">playerAge</label>
      <input type="number" id="playerAge" formControlName="playerAge" [appHighlightOnFocus]="'pink'"/>
    </div>

    <div class="form-group">
      <label for="isplayertrophies">isplayertrophies</label>
      <input type="checkbox" id="isplayertrophies" formControlName="isplayertrophies" [appHighlightOnFocus]="'pink'"/>
    </div>

   <button type="submit">Submit</button>


</form>
<div *ngIf="error" class="error">{{ error }}</div>
